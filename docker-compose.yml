services:
  # Backend - FastAPI + SQLite
  backend:
    build: ./backend
    container_name: tallerpro-backend
    ports:
      - "8001:8000"
    volumes:
      # Persistir base de datos SQLite
      - ./data:/app/data
      # Persistir archivos subidos
      - ./uploads:/app/uploads
    environment:
      - DATABASE_URL=sqlite:///./data/taller.db
      - SECRET_KEY=${SECRET_KEY:-cambiar-esta-clave-secreta-en-produccion}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - tallerpro-network

  # Frontend - React + Nginx
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tallerpro-frontend
    ports:
      - "8000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tallerpro-network

networks:
  tallerpro-network:
    driver: bridge

volumes:
  db-data:
  uploads:
