<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>TallerPro - Sistema de Gestión para Taller Mecánico</title>
    <meta name="title" content="TallerPro - Sistema de Gestión para Taller Mecánico" />
    <meta name="description" content="Aplicación web PWA para gestión integral de talleres de reparación de motocicletas y carros. Control de órdenes, inventario, clientes y caja." />
    <meta name="keywords" content="taller mecánico, gestión taller, órdenes servicio, inventario repuestos, PWA, motocicletas, carros" />
    <meta name="author" content="TallerPro" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="Spanish" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TallerPro - Sistema de Gestión para Taller Mecánico" />
    <meta property="og:description" content="Aplicación web PWA para gestión integral de talleres de reparación de motocicletas y carros." />
    <meta property="og:image" content="/icon-512.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="TallerPro - Sistema de Gestión para Taller Mecánico" />
    <meta property="twitter:description" content="Aplicación web PWA para gestión integral de talleres de reparación." />
    <meta property="twitter:image" content="/icon-512.png" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TallerPro" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    
    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    
    <!-- Security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    
    <style>
      /* Critical CSS - Loading screen */
      #root:empty {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: #f3f4f6;
      }
      #root:empty::before {
        content: '🔧';
        font-size: 4rem;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.9); }
      }
    </style>
  </head>
  <body class="bg-gray-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[SW] Service Worker registered:', registration.scope);
              
              // Check for updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[SW] New version available');
                    if (confirm('Nueva versión disponible. ¿Recargar?')) {
                      window.location.reload();
                    }
                  }
                });
              });
            })
            .catch((error) => {
              console.log('[SW] Registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
